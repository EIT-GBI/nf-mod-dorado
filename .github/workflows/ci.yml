name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Nextflow strict syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nf-core/setup-nextflow@v3
        with:
          version: '26.04.4'
      - run: nextflow lint -o concise .

      - name: Container tag matches manifest.version
        # release.yml moves these together; this catches a hand-edit that moves
        # only one of them, which would ship a module pointing at the wrong image.
        run: |
          set -euo pipefail
          VERSION=$(grep -oP "version\s*=\s*['\"]\K[^'\"]+" nextflow.config)
          [ -f conf/module.config ] || { echo "no conf/module.config; skipping"; exit 0; }
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # only this repo's own image is version-locked; external ones are not
          if grep -q "${IMAGE}" conf/module.config; then
            TAG=$(grep -oE "${IMAGE}:v[0-9]+\.[0-9]+\.[0-9]+" conf/module.config | head -1 | sed 's/.*:v//')
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::conf/module.config pins v${TAG} but manifest.version is ${VERSION}"
              exit 1
            fi
            echo "conf/module.config pins v${TAG}, matching manifest.version"
          else
            echo "conf/module.config uses an external image; nothing to check"
          fi

  test:
    # DELIBERATELY DIFFERS from the org's copy of this workflow (nf-mod-samtools
    # et al.), which builds the image and runs every nf-test case. This module's
    # image is ~11 GB unpacked (CUDA runtime base plus ~4.3 GB of dorado and its
    # bundled libraries), and building it needs more disk than a GitHub-hosted
    # runner has free (~14 GB). So CI runs only the stub tests, which need no
    # image. The real DORADO_TRIM / DORADO_ALIGNER tests stay in the repo and
    # are run locally (see the README's Tests section); DORADO_BASECALLER needs
    # a GPU and is stub-only everywhere. The lint job above is the org's, as is.
    name: nf-test (stub tests only)
    runs-on: ubuntu-latest
    env:
      # nf-test 0.9.3 generates its harness with the spread operator and a for
      # loop, both removed by the strict parser that Nextflow 26.04 enables by
      # default. The module code itself is strict-clean (see the lint job); this
      # only opts the generated harness out. Drop once nf-test emits strict syntax.
      NXF_SYNTAX_PARSER: v1
    steps:
      - uses: actions/checkout@v5
      - uses: nf-core/setup-nextflow@v3
        with:
          version: '26.04.4'
      - uses: nf-core/setup-nf-test@v2
        with:
          version: '0.9.3'
      - run: nf-test test --tag stub --verbose
